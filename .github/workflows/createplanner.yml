name: Create Planner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      year:
        type: string
        description: What year to generate the planner for
      cfg:
        type: string
        description: Device preset (rmpp, rm2, sn_a5x, sn_a6x, kscribe) or a comma-separated cfg list. See README for details.

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Test
        run: nix develop -c go test ./...

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build planner
        run: |
          nix develop -c ./build.sh -o planner \
            "${{ github.event.inputs.cfg || 'rmpp' }}" \
            "${{ github.event.inputs.year || '' }}"
      - name: Output PDF
        uses: actions/upload-artifact@v4
        with:
          name: planner.pdf
          path: planner.pdf
          if-no-files-found: error
